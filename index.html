<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stargazers log</title>
    <style>
      :root {
        color: #17221b;
        background: #f3f0e8;
        font-family: Georgia, "Times New Roman", serif;
        line-height: 1.5;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-width: 320px;
        background: radial-gradient(circle at 85% 8%, #dbe5d3 0, transparent 28rem), #f3f0e8;
      }

      main {
        width: min(100% - 2rem, 960px);
        margin: 0 auto;
        padding: 4.5rem 0 5rem;
      }

      .eyebrow {
        margin: 0 0 0.75rem;
        color: #55715d;
        font: 700 0.75rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 620px;
        margin: 0;
        font-size: clamp(2.8rem, 8vw, 5.8rem);
        font-weight: 400;
        letter-spacing: -0.04em;
        line-height: 0.98;
      }

      .intro {
        max-width: 460px;
        margin: 1.5rem 0 3rem;
        color: #5b665d;
        font-size: 1.1rem;
      }

      .toolbar {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 1rem;
        padding: 1rem 0;
        border-top: 1px solid #c8cec3;
        border-bottom: 1px solid #c8cec3;
      }

      label {
        display: grid;
        gap: 0.4rem;
        color: #55715d;
        font: 700 0.75rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      select {
        min-width: 190px;
        padding: 0.7rem 2.4rem 0.7rem 0.8rem;
        border: 1px solid #aab8a9;
        border-radius: 4px;
        color: #17221b;
        background: #fffdf8;
        font: inherit;
        cursor: pointer;
      }

      .result-count {
        margin: 0;
        color: #68736a;
        font-size: 0.95rem;
      }

      .repositories {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 1rem;
        margin-top: 1.5rem;
      }

      .repository {
        min-height: 190px;
        padding: 1.25rem;
        border: 1px solid #d2d6cc;
        border-radius: 4px;
        background: rgba(255, 253, 248, 0.78);
      }

      .repository h2 {
        margin: 0 0 0.45rem;
        font-size: 1.35rem;
        font-weight: 400;
      }

      .repository h2 a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 3px; }
      .repository h2 a:hover { color: #55715d; }

      .repository p { margin: 0; color: #68736a; }

      .meta {
        display: flex;
        gap: 1rem;
        margin-top: 1.25rem;
        color: #55715d;
        font: 0.78rem ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      .language-dot {
        display: inline-block;
        width: 0.65rem;
        height: 0.65rem;
        margin-right: 0.35rem;
        border-radius: 50%;
        background: #d7a441;
      }

      .empty-state {
        grid-column: 1 / -1;
        margin: 2rem 0;
        color: #68736a;
        text-align: center;
      }

      @media (max-width: 520px) {
        main { padding-top: 3rem; }
        .toolbar { align-items: stretch; flex-direction: column; }
        select { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">A personal index of</p>
      <h1>Stargazers log</h1>
      <p class="intro">A log of the repositories I've starred, grouped by the languages that shape them.</p>

      <section class="toolbar" aria-label="Repository filters">
        <label for="language-filter">
          Filter by language
          <select id="language-filter">
            <option value="all">All languages</option>
          </select>
        </label>
        <p class="result-count" id="result-count" aria-live="polite"></p>
      </section>

      <section class="repositories" id="repositories" aria-live="polite"></section>
    </main>

    <script>
      const starredRepositories = [
        { name: "octo-notes", owner: "you", language: "JavaScript", description: "A tiny, thoughtful notes app for quick ideas.", stars: 184, url: "#" },
        { name: "river-tools", owner: "you", language: "Python", description: "Small command-line tools for working with data.", stars: 92, url: "#" },
        { name: "signal-kit", owner: "you", language: "Go", description: "A compact toolkit for reliable services.", stars: 67, url: "#" },
        { name: "plain-config", owner: "you", language: "JavaScript", description: "Simple configuration without the ceremony.", stars: 41, url: "#" },
        { name: "paper-sim", owner: "you", language: "Python", description: "Experiments in simulation and visual storytelling.", stars: 28, url: "#" }
      ];

      const filter = document.querySelector("#language-filter");
      const repositoryList = document.querySelector("#repositories");
      const resultCount = document.querySelector("#result-count");
      const languages = [...new Set(starredRepositories.map((repository) => repository.language))].sort();

      languages.forEach((language) => {
        const option = document.createElement("option");
        option.value = language;
        option.textContent = language;
        filter.append(option);
      });

      function renderRepositories() {
        const selectedLanguage = filter.value;
        const visibleRepositories = selectedLanguage === "all"
          ? starredRepositories
          : starredRepositories.filter((repository) => repository.language === selectedLanguage);

        resultCount.textContent = `${visibleRepositories.length} ${visibleRepositories.length === 1 ? "repository" : "repositories"}`;
        repositoryList.replaceChildren();

        if (visibleRepositories.length === 0) {
          const emptyState = document.createElement("p");
          emptyState.className = "empty-state";
          emptyState.textContent = "No starred repositories use this language yet.";
          repositoryList.append(emptyState);
          return;
        }

        visibleRepositories.forEach((repository) => {
          const article = document.createElement("article");
          article.className = "repository";
          article.innerHTML = `
            <h2><a href="${repository.url}">${repository.owner}/${repository.name}</a></h2>
            <p>${repository.description}</p>
            <div class="meta">
              <span><span class="language-dot"></span>${repository.language}</span>
              <span>★ ${repository.stars}</span>
            </div>
          `;
          repositoryList.append(article);
        });
      }

      filter.addEventListener("change", renderRepositories);
      renderRepositories();
    </script>
  </body>
</html>
